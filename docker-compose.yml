version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qrmenu-postgres
    environment:
      POSTGRES_DB: qrmenu_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qrmenu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: qrmenu-api
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://postgres:password@postgres:5432/qrmenu_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      S3_BUCKET: qrmenu-uploads
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api/src:/app/api/src
      - /app/api/node_modules
    command: npm run dev

  dashboard:
    build:
      context: .
      dockerfile: frontend/dashboard/Dockerfile
    container_name: qrmenu-dashboard
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend/dashboard/src:/app/frontend/dashboard/src
      - /app/frontend/dashboard/node_modules
    command: npm run dev

  public-menu:
    build:
      context: .
      dockerfile: frontend/public-menu/Dockerfile
    container_name: qrmenu-public-menu
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3002:3002"
    depends_on:
      - api
    volumes:
      - ./frontend/public-menu/src:/app/frontend/public-menu/src
      - /app/frontend/public-menu/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
