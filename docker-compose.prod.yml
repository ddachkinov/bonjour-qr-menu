version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: production
    container_name: qrmenu-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: .
      dockerfile: frontend/dashboard/Dockerfile
      target: production
    container_name: qrmenu-dashboard-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api

  public-menu:
    build:
      context: .
      dockerfile: frontend/public-menu/Dockerfile
      target: production
    container_name: qrmenu-public-menu-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}
    ports:
      - "3002:3002"
    depends_on:
      - api
